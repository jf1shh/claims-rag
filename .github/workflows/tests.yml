name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Self-hosted runner (labeled "autoclaimsrag") on Jared's own machine --
  # this repo is private, so GitHub-hosted minutes are capped; self-hosted
  # avoids the cap entirely and matches the project's own "runs entirely on
  # my own machine, no cloud" design constraint. See ~/actions-runner and the
  # systemd unit actions.runner.jf1shh-auto-claims-rag.*.service.
  #
  # >>> BEFORE MAKING THIS REPO PUBLIC: change `runs-on` in both jobs below
  # to `ubuntu-latest` (and re-add a windows-latest leg if desired -- the
  # postgres service container works on GitHub-hosted Linux too). This
  # trigger is plain `pull_request`, which self-hosted runners must never
  # execute for a public repo (an external PR's code would run on this
  # machine). The private-repo minutes cap that justified self-hosted in the
  # first place disappears the moment the repo goes public -- GitHub Actions
  # is free/unlimited on standard hosted runners for public repos -- so this
  # switch is a pure win with no cost tradeoff, not a compromise. See
  # docs/operations/local-and-production.md for the full checklist.
  pytest-linux:
    runs-on: [self-hosted, linux, autoclaimsrag]
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python's downloadable manifest has no prebuilt release
      # for this host's distro (CachyOS rolling), so it 404s on self-hosted.
      # Python 3.12 is already installed on the runner host itself -- use it
      # directly via a per-run venv instead of setup-python.
      - name: Set up venv
        run: python3.12 -m venv .venv && .venv/bin/pip install --upgrade pip

      # Install the pinned runtime/test dependencies needed by the API,
      # contracts, parsers, and tests. Model engines import lazily, so CI does
      # not contact hosted model services or require keys/tokens.
      - name: Install test dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Run linter
        run: .venv/bin/ruff check .

      # Deterministic foundation gates (backend/harness.py): secrets/specs/docs/
      # lint plus the dependency-audit (pip-audit) and static-security (bandit)
      # sensors. Advisory findings print but don't fail the build; only a
      # blocking finding (currently: any HIGH severity + HIGH confidence bandit
      # result) does.
      - name: Run foundation gates
        run: .venv/bin/python scripts/run_foundation_gates.py --mode gate

      - name: Run unit tests
        run: .venv/bin/pytest tests/ -v

      # Phase 0.2 of docs/enterprise-migration.md: retrieval parity harness.
      # Self-check mode (sqlite vs sqlite on two independent DBs) must report
      # parity of exactly 1.0 -- it proves the harness itself is sound before
      # any second backend exists. Phase 1 adds a postgres service + a
      # --backend-b postgres comparison.
      - name: Retrieval parity self-check
        run: .venv/bin/python eval/parity_runner.py

  # Phase 1 (docs/enterprise-migration.md): Postgres + pgvector data plane.
  # Runs on the self-hosted runner (Docker is installed there specifically
  # for this). The Postgres test module self-provisions the schema via
  # `alembic upgrade head`, and the golden parity harness is pointed at Postgres
  # with the looser 0.9 tolerance (pgvector HNSW is approximate vs SQLite's
  # exact brute-force search).
  # >>> BEFORE MAKING THIS REPO PUBLIC: same change as pytest-linux above --
  # switch `runs-on` to `ubuntu-latest`. See that comment for why.
  postgres:
    runs-on: [self-hosted, linux, autoclaimsrag]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4

      # See the matching comment in pytest-linux -- setup-python has no
      # release for this distro; use the runner host's system Python 3.12.
      - name: Set up venv
        run: python3.12 -m venv .venv && .venv/bin/pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Run linter
        run: .venv/bin/ruff check .

      # Runs the whole suite (not just test_postgres_store.py) so every
      # PG-gated case -- wherever its file lives -- actually executes here
      # instead of silently skipping (the only place POSTGRES_DSN is set).
      # The SQLite-only tests re-run too; that's ~8s of harmless redundancy,
      # not a maintenance trap where a new PG-gated file needs a second
      # explicit path added to this step to ever run in CI.
      - name: Run Postgres backend tests (migrations + store + RLS + PG-gated cases)
        run: .venv/bin/pytest tests/ -v

      - name: Inter-backend retrieval parity (Postgres vs SQLite)
        run: .venv/bin/python eval/parity_runner.py --backend-b postgres --tolerance 0.9
