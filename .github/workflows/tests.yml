name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Contract tests must pass on a fresh runner without a model cache or downloads.
env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  # While the repo is private, pushes and PRs (owner-only) use the local runner; any public run uses hosted Linux.
  pytest-linux:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "claimsrag"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !github.event.repository.private }}
        with:
          python-version: '3.12'

      # actions/setup-python's downloadable manifest has no prebuilt release
      # for this host's distro (CachyOS rolling), so it 404s on self-hosted.
      # Python 3.12 is already installed on the runner host itself -- use it
      # directly via a per-run venv instead of setup-python.
      - name: Set up venv
        run: python3.12 -m venv .venv && .venv/bin/pip install --upgrade pip

      # Install the pinned runtime/test dependencies needed by the API,
      # contracts, parsers, and tests. Model engines import lazily, so CI does
      # not contact hosted model services or require keys/tokens.
      - name: Install test dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Run linter
        run: .venv/bin/ruff check .

      # Deterministic foundation gates (backend/harness.py): secrets/specs/docs/
      # lint plus the dependency-audit (pip-audit) and static-security (bandit)
      # sensors. Advisory findings print but don't fail the build; only a
      # blocking finding (currently: any HIGH severity + HIGH confidence bandit
      # result) does.
      - name: Run foundation gates
        run: .venv/bin/python scripts/run_foundation_gates.py --mode gate

      - name: Run unit tests
        run: .venv/bin/pytest tests/ -v

      # Phase 0.2 of docs/enterprise-migration.md: retrieval parity harness.
      # Self-check mode (sqlite vs sqlite on two independent DBs) must report
      # parity of exactly 1.0 -- it proves the harness itself is sound before
      # any second backend exists. Phase 1 adds a postgres service + a
      # --backend-b postgres comparison.
      - name: Retrieval parity self-check
        run: .venv/bin/python eval/parity_runner.py

  # Phase 1 (docs/enterprise-migration.md): Postgres + pgvector data plane.
  # Routed like pytest-linux above (hosted Linux while public). The Postgres
  # test module self-provisions the schema via `alembic upgrade head`, and the
  # golden parity harness is pointed at Postgres with the looser 0.9 tolerance
  # (pgvector HNSW is approximate vs SQLite's exact brute-force search).
  postgres:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "claimsrag"]') || 'ubuntu-latest' }}
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/rag
      PG_CONTAINER: claimsrag-pg-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Started as a step, not a `services:` container: hosted runners share
      # Docker Hub's anonymous pull limit (it failed this job before any test
      # ran), and a service container's `credentials:` rejects empty secrets
      # instead of skipping login. Here login happens only when both secrets
      # are set; forks, or a repo without them, pull anonymously.
      - name: Start Postgres (pgvector)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi
          for attempt in 1 2 3; do
            docker pull pgvector/pgvector:pg16 && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done
          docker run -d --name "$PG_CONTAINER" -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rag \
            pgvector/pgvector:pg16
          for _ in $(seq 30); do
            docker exec "$PG_CONTAINER" pg_isready -U postgres -h localhost && exit 0
            sleep 2
          done
          docker logs "$PG_CONTAINER"
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !github.event.repository.private }}
        with:
          python-version: '3.12'

      # See the matching comment in pytest-linux -- setup-python has no
      # release for this distro; use the runner host's system Python 3.12.
      - name: Set up venv
        run: python3.12 -m venv .venv && .venv/bin/pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Run linter
        run: .venv/bin/ruff check .

      # Runs the whole suite (not just test_postgres_store.py) so every
      # PG-gated case -- wherever its file lives -- actually executes here
      # instead of silently skipping (the only place POSTGRES_DSN is set).
      # The SQLite-only tests re-run too; that's ~8s of harmless redundancy,
      # not a maintenance trap where a new PG-gated file needs a second
      # explicit path added to this step to ever run in CI.
      - name: Run Postgres backend tests (migrations + store + RLS + PG-gated cases)
        run: .venv/bin/pytest tests/ -v

      - name: Inter-backend retrieval parity (Postgres vs SQLite)
        run: .venv/bin/python eval/parity_runner.py --backend-b postgres --tolerance 0.9

      # Self-hosted runners keep Docker state between jobs.
      - name: Stop Postgres
        if: always()
        run: |
          docker rm -f "$PG_CONTAINER" || true
          docker logout || true
