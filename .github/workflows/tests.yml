name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the pinned runtime/test dependencies needed by the API,
      # contracts, parsers, and tests. Model engines import lazily, so CI does
      # not contact hosted model services or require keys/tokens.
      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run linter
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/ -v

      # Phase 0.2 of docs/enterprise-migration.md: retrieval parity harness.
      # Self-check mode (sqlite vs sqlite on two independent DBs) must report
      # parity of exactly 1.0 -- it proves the harness itself is sound before
      # any second backend exists. Phase 1 adds a postgres service + a
      # --backend-b postgres comparison.
      - name: Retrieval parity self-check
        run: python eval/parity_runner.py

  # Phase 1 (docs/enterprise-migration.md): Postgres + pgvector data plane.
  # Runs only on ubuntu because GitHub Actions does not run service containers
  # on Windows runners. The Postgres test module self-provisions the schema via
  # `alembic upgrade head`, and the golden parity harness is pointed at Postgres
  # with the looser 0.9 tolerance (pgvector HNSW is approximate vs SQLite's
  # exact brute-force search).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter
        run: ruff check .

      - name: Run Postgres backend tests (migrations + store + RLS)
        run: pytest tests/test_postgres_store.py -v

      - name: Inter-backend retrieval parity (Postgres vs SQLite)
        run: python eval/parity_runner.py --backend-b postgres --tolerance 0.9
